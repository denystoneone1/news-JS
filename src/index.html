<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400&display=swap"
        />
    </head>
    <body>
        <header class="masthead">
            <div class="masthead__inner">
                <p class="masthead__date"></p>
                <div class="search" role="search">
                    <label class="search__label" for="source-search">Find a source</label>
                    <input
                        id="source-search"
                        class="search__input"
                        type="search"
                        placeholder="Find a source"
                        autocomplete="off"
                        aria-controls="search-results"
                        aria-expanded="false"
                    />
                    <ul id="search-results" class="search__results" hidden></ul>
                </div>
                <h1 class="masthead__title">News Portal</h1>
                <nav class="top-sources" aria-label="Popular sources">
                    <ul class="top-sources__list"></ul>
                    <button type="button" class="top-sources__all" aria-haspopup="dialog">
                        All sources <span class="top-sources__count"></span>
                    </button>
                </nav>
            </div>
        </header>
        <main>
            <section class="section-head" hidden>
                <h2 class="section-head__title"></h2>
                <p class="section-head__text"></p>
            </section>
            <div class="news" aria-live="polite">
                <p class="news__empty">Loading sources…</p>
            </div>
        </main>
        <footer class="footer">
            <div class="footer__inner">
                <a
                    class="footer__github"
                    href="https://github.com/denystoneone1"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub: denystoneone1
                </a>
                <p class="footer__info">
                    <span class="footer__year">2026</span>
                    <span class="footer__api">
                        Data:
                        <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">NewsAPI</a>
                    </span>
                </p>
                <a
                    class="footer__rss"
                    href="https://rs.school/courses/javascript"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="RS School JavaScript course"
                >
                    <img class="footer__logo" src="assets/rss-logo.svg" alt="RS School" width="40" height="40" />
                </a>
            </div>
        </footer>

        <dialog class="catalog" aria-labelledby="catalog-title">
            <div class="catalog__head">
                <h2 id="catalog-title" class="catalog__title">All sources</h2>
                <button type="button" class="catalog__close">Close</button>
            </div>
            <nav class="categories" aria-label="Filter sources by category"></nav>
            <div class="catalog__list"></div>
        </dialog>

        <template id="sourceItemTemp">
            <button type="button" class="source__item">
                <img class="source__logo" src="" alt="" width="20" height="20" loading="lazy" />
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <article class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                </div>
                <div class="news__description">
                    <h3 class="news__description-source"></h3>
                    <h2 class="news__description-title" dir="auto"></h2>
                    <p class="news__description-content" dir="auto"></p>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                    <p class="news__read-more">
                        <a href="#" target="_blank" rel="noopener noreferrer">Read the full story</a>
                    </p>
                </div>
            </article>
        </template>
    </body>
</html>
